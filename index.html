<script>
const APP_KEY='my-reading-library-v1';
let books=[]; let publishers=[]; let formats=[]; let genres=[]; let currentView='dashboard'; let sortKey='id'; let sortDir='desc'; let charts={}; let editingId=null; let importFiles=[];

const canonicalHeaders=[
 ['ID','id'],['表紙','cover'],['タイトル','title'],['作者','author'],['翻訳者','translator'],['翻訳区分','translationType'],['フォーマットID','formatId'],['出版社ID','publisherId'],['出版社','publisher'],['フォーマット','format'],['ジャンルID','genreId'],['ジャンル','genre'],['再読回数','repetition'],['状態ID','statusId'],['状態','status'],['メモ','memo'],['感想・考え','think'],['読み始め日','startedAt'],['読了日','finishedAt'],['評価','rating'],['ページ数','pages'],['タグ','tags'],['追加日','addedAt']
];
const aliases={id:['id','ID','番号','No','no'],cover:['cover','表紙','表紙URL','cover_url'],title:['title','タイトル','書名','本のタイトル'],author:['author','作者','著者'],translator:['translator','翻訳者','訳者'],translationType:['translationType','翻訳区分','翻訳種別','translate'],formatId:['formatId','フォーマットID','format_id'],publisherId:['publisherId','出版社ID','publisher_id'],publisher:['publisher','出版社'],format:['format','フォーマット','形式'],genreId:['genreId','ジャンルID','genre_id','g_id'],genre:['genre','ジャンル'],repetition:['repetition','再読回数','読み返し回数'],statusId:['statusId','状態ID','status_id'],status:['status','状態','読書状態'],memo:['memo','メモ','読書メモ'],think:['think','感想','感想・考え','考え'],startedAt:['startedAt','読み始め日','開始日','start_date'],finishedAt:['finishedAt','読了日','読み終えた日','終了日','finish_date'],rating:['rating','評価','星','★'],pages:['pages','ページ数','頁数'],tags:['tags','タグ'],addedAt:['addedAt','追加日','登録日']};
const STATUS_READ=['既読','読了','読み終わり','完読'];
const STATUS_NOW=['読み中','読書中','進行中'];
const STATUS_STACK=['積読中','未読','積読'];
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'\\\\','"':'&quot;'}[m]||m));}
function text(s){return String(s??'').trim()}
function n(v){const x=Number(String(v).replace(/,/g,''));return Number.isFinite(x)?x:0}
function isoNow(){return new Date().toISOString()}
function splitNames(value){return [...new Set(String(value??'').split(/[,、，]/).map(text).filter(Boolean))]}
function authorCounts(){const counts=new Map();books.forEach(b=>{const names=splitNames(b.author);if(!names.length)names.push('未登録');names.forEach(name=>counts.set(name,(counts.get(name)||0)+1))});return [...counts].map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value).slice(0,12)}
function masterId(prefix,items){return `${prefix}-${Math.max(0,...items.map(x=>n(String(x.id).replace(/\D/g,''))))+1}`}
function masterOptions(items,currentId,currentName,emptyLabel){
  const selectedId=text(currentId);
  const selectedName=text(currentName);
  const hasCurrent=selectedId&&items.some(x=>String(x.id)===selectedId)||selectedName&&items.some(x=>x.name===selectedName);
  return `<option value="">${emptyLabel}</option>${!hasCurrent&&selectedName?`<option value="__legacy__" selected>${esc(selectedName)}（既存）</option>`:''}${items.map(x=>`<option value="${esc(x.id)}" ${(String(x.id)===selectedId||(!selectedId&&x.name===selectedName))?'selected':''}>${esc(x.name)}</option>`).join('')}`;
}
function findMaster(items,id,name){return items.find(x=>String(x.id)===String(id))||items.find(x=>x.name===text(name))}
async function saveMasters(){return putDB('masters',{publishers,formats,genres})}
function masterConfig(kind){return {publisher:{label:'出版社',prefix:'pub',items:publishers,field:'publisher',idField:'publisherId'},format:{label:'フォーマット',prefix:'fmt',items:formats,field:'format',idField:'formatId'},genre:{label:'ジャンル',prefix:'gen',items:genres,field:'genre',idField:'genreId'}}[kind]}
function addMaster(kind){const config=masterConfig(kind);const value=text(prompt(`${config.label}名を入力してください`));if(!value)return;const items=config.items;if(items.some(x=>x.name===value)){toast('同じ名前が登録されています');return}const item={id:masterId(config.prefix,items),name:value};items.push(item);saveMasters().then(()=>{const select=document.getElementById(`f${kind[0].toUpperCase()}${kind.slice(1)}`);if(select){select.insertAdjacentHTML('beforeend',`<option value="${esc(item.id)}">${esc(item.name)}</option>`);select.value=item.id}else renderManage();toast(`${config.label}を登録しました`)}).catch(e=>toast(`登録に失敗しました：${e.message}`))}
function removeMaster(kind,id){const config=masterConfig(kind);const item=config.items.find(x=>String(x.id)===String(id));if(!item)return;if(books.some(b=>String(b[config.idField])===String(id))){toast('本で使用中のため削除できません');return}if(!confirm(`「${item.name}」を削除しますか？`))return;if(kind==='publisher')publishers=publishers.filter(x=>String(x.id)!==String(id));else if(kind==='format')formats=formats.filter(x=>String(x.id)!==String(id));else genres=genres.filter(x=>String(x.id)!==String(id));saveMasters().then(renderManage)}
function isRead(b){return STATUS_READ.includes(text(b.status)) || ['kdk'].includes(text(b.statusId))}
function isNow(b){return STATUS_NOW.includes(text(b.status)) || ['now'].includes(text(b.statusId))}
function isStack(b){return STATUS_STACK.includes(text(b.status)) || ['stk','stack'].includes(text(b.statusId))}
function statusClass(b){return isRead(b)?'read':isNow(b)?'now':isStack(b)?'stack':''}

function filteredBooks(extra={}){
  const q=text(document.getElementById('globalSearch')?.value).toLowerCase();
  return books.filter(b=>{
    if(q){const hay=[b.title,b.author,b.translator,b.publisher,b.genre,b.format,b.memo,b.think,b.tags].join(' ').toLowerCase(); if(!hay.includes(q)) return false}
    if(extra.status && extra.status!=='all' && displayStatus(b)!==extra.status) return false;
    if(extra.genre && extra.genre!=='all' && !splitNames(b.genre).includes(extra.genre)) return false;
    if(extra.publisher && extra.publisher!=='all' && b.publisher!==extra.publisher) return false;
    return true;
  })
}

async function clearAllData(){
  if(!confirm('本棚の本・メモ・表紙データをすべて削除します。続けますか？'))return;
  if(!confirm('この操作は元に戻せません。本当に完全削除しますか？'))return;
  try{
    await new Promise((resolve,reject)=>{
      const req=indexedDB.open(APP_KEY,1);
      req.onsuccess=()=>{const db=req.result;const q=db.transaction('state','readwrite').objectStore('state').clear();q.onsuccess=resolve;q.onerror=()=>reject(q.error)};
      req.onerror=()=>reject(req.error);
    });
    books=[];publishers=[];formats=[];genres=[];renderAll();toast('本棚のデータを完全に削除しました');
  }catch(e){console.error(e);toast('削除に失敗しました：'+e.message)}
}

ass="btn" type="button" style="margin-top:5px" onclick="addMaster(&#39;genre&#39;)">＋ ジャンルを登録</button></div><div class="fieldgroup"><label>状態</label><select id="fStatus"><option ${v.status==='既読'?'selected':''}>既読</option><option ${v.status==='読み中'?'selected':''}>読み中</option><option ${v.status==='積読中'?'selected':''}>積読中</option><option ${v.status&& !['既読','読み中','積読中'].includes(v.status)?'selected':''}>その他</option></select></div><div class="fieldgroup"><label>再読回数</label><input id="fRepetition" type="number" min="0" value="${n(v.repetition)}"></div><div class="fieldgroup"><label>評価</label><input id="fRating" type="number" min="0" max="5" step="0.5" value="${esc(v.rating)}"></div><div class="fieldgroup"><label>ページ数</label><input id="fPages" type="number" min="0" value="${esc(v.pages)}"></div><div class="fieldgroup"><label>読み始め日</label><input id="fStartedAt" type="date" value="${esc(text(v.startedAt).slice(0,10))}"></div><div class="fieldgroup"><label>読了日</label><input id="fFinishedAt" type="date" value="${esc(text(v.finishedAt).slice(0,10))}"></div><div class="fieldgroup full"><label>タグ</label><input id="fTags" value="${esc(v.tags)}" placeholder="例：哲学,小説,再読候補"></div><div class="fieldgroup full"><label>メモ</label><textarea id="fMemo">${esc(v.memo)}</textarea></div><div class="fieldgroup full"><label>感想・考え</label><textarea id="fThink">${esc(v.think)}</textarea></div></div></div></div><div class="modal-actions">${b?'<button class="btn danger" onclick="deleteBook(\''+esc(b.id)+'\')">削除</button>':''}<div style="flex:1"></div><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="saveBookFromForm()">保存</button></div></div>`); const file=document.getElementById('fCoverFile');file.onchange=async e=>{const f=e.target.files[0];if(f){const data=await fileToDataURL(f);document.getElementById('editCover').innerHTML=`<img src="${esc(data)}" alt="">`;document.getElementById('editCover').dataset.cover=data}}

async function saveBookFromForm(){const b=editingId?books.find(x=>String(x.id)===String(editingId)):null;const publisherValue=document.getElementById('fPublisher').value;const formatValue=document.getElementById('fFormat').value;const genreValue=document.getElementById('fGenre').value;const publisher=findMaster(publishers,publisherValue,publisherValue==='__legacy__'?b?.publisher:'');const format=findMaster(formats,formatValue,formatValue==='__legacy__'?b?.format:'');const genre=findMaster(genres,genreValue,genreValue==='__legacy__'?b?.genre:'');const cover=document.getElementById('editCover').dataset.cover??(b?.cover||'');const obj={...(b||{}),id:b?.id||nextId(),cover,title:text(document.getElementById('fTitle').value),author:text(document.getElementById('fAuthor').value),translator:text(document.getElementById('fTranslator').value),publisherId:publisher?.id||'',publisher:publisher?.name||(publisherValue==='__legacy__'?text(b?.publisher):''),formatId:format?.id||'',format:format?.name||(formatValue==='__legacy__'?text(b?.format):''),genreId:genre?.id||'',genre:genre?.name||(genreValue==='__legacy__'?text(b?.genre):''),status:text(document.getElementById('fStatus').value),repetition:n(document.getElementById('fRepetition').value),rating:document.getElementById('fRating').value,pages:document.getElementById('fPages').value,startedAt:document.getElementById('fStartedAt').value,finishedAt:document.getElementById('fFinishedAt').value,tags:text(document.getElementById('fTags').value),memo:document.getElementById('fMemo').value,think:document.getElementById('fThink').value,addedAt:b?.addedAt||isoNow()}; if(!obj.title){toast('タイトルを入力してください');return}if(b)Object.assign(b,obj);else books.push(obj);await saveDB();closeModal();renderAll();toast(b?'本を更新しました':'本を追加しました')}

function setISBNPrompt(){const isbn=prompt('ISBNを入力してください（ハイフン可）');if(!isbn)return;const clean=isbn.replace(/[^0-9Xx]/g,'');if(!clean)return;const url=`https://covers.openlibrary.org/isbn/${encodeURIComponent(clean)}-L.jpg`;document.getElementById('editCover').innerHTML=`<img src="${esc(url)}" alt="">`;document.getElementById('editCover').dataset.cover=url;document.getElementById('editCover').querySelector('img').onerror=()=>{toast('表紙を取得できませんでした');clearCover()}}
function normalizeHeader(value){return String(value??'').replace(/^\uFEFF/,'').trim().toLowerCase().replace(/[（(].*$/,'').trim().replace(/[\s　]+/g,'_')}
function normalize(raw,i){const r={};const lookup=Object.fromEntries(Object.entries(raw).map(([k,v])=>[normalizeHeader(k),v])); for(const [field,names] of Object.entries(aliases)){let val='';for(const name of names){const key=normalizeHeader(name);if(lookup[key]!==undefined&&lookup[key]!==''){val=lookup[key];break}}r[field]=field==='repetition'?n(val):text(val)} if(!r.id)r.id=String(i); if(!r.addedAt)r.addedAt=isoNow(); if(!r.status)r.status=''; return r}
async function handleImportFile(file){if(!file)return;try{const name=file.name.toLowerCase();if(name.endsWith('.json')){const obj=JSON.parse(await file.text());const incoming=Array.isArray(obj)?obj:obj.books;if(!Array.isArray(incoming))throw new Error('JSONにbooks配列がありません');await importBooks(incoming,'JSON');return}const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});const sheet=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});const incoming=rows.map((r,i)=>normalize(r,i+1)).filter(b=>b.title||b.author);if(!incoming.length)throw new Error('本の行を見つけられませんでした');const covers=await extractXlsxCovers(buf);if(covers.length){incoming.forEach((b,i)=>{if(covers[i])b.cover=covers[i]})}await importBooks(incoming,name.endsWith('.csv')?'CSV':'XLSX')}catch(e){console.error(e);toast('読み込みに失敗しました：'+e.message)}}
function xlsxRows(sheet){const ref=sheet['!ref'];if(!ref)return[];const range=XLSX.utils.decode_range(ref);const headers=[];for(let c=range.s.c;c<=range.e.c;c++){const cell=sheet[XLSX.utils.encode_cell({r:range.s.r,c})];headers[c]=cell?.v??cell?.w??''}const rows=[];for(let r=range.s.r+1;r<=range.e.r;r++){const row={};for(let c=range.s.c;c<=range.e.c;c++){const key=headers[c];if(key===undefined||key==='')continue;const cell=sheet[XLSX.utils.encode_cell({r,c})];row[key]=cell?((cell.v!==undefined&&cell.v!==null)?cell.v:(cell.w??'')):''}rows.push(row)}return rows}
async function handleImportFile(file){if(!file)return;try{const name=file.name.toLowerCase();if(name.endsWith('.json')){const obj=JSON.parse(await file.text());const incoming=Array.isArray(obj)?obj:obj.books;if(!Array.isArray(incoming))throw new Error('JSONにbooks配列がありません');await importBooks(incoming,'JSON');return}const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true,cellStyles:true});const sheet=wb.Sheets[wb.SheetNames[0]];const rows=xlsxRows(sheet);const incoming=rows.map((r,i)=>normalize(r,i+1)).filter(b=>b.title||b.author);if(!incoming.length)throw new Error('本の行を見つけられませんでした');const covers=await extractXlsxCovers(buf);if(covers.length){incoming.forEach((b,i)=>{if(covers[i])b.cover=covers[i]})}await importBooks(incoming,name.endsWith('.csv')?'CSV':'XLSX')}catch(e){console.error(e);toast('読み込みに失敗しました：'+e.message)}}
async function extractXlsxCovers(buf){try{if(!window.JSZip)return[];const zip=await JSZip.loadAsync(buf);const workbookXml=await zip.file('xl/workbook.xml').async('string');const relXml=await zip.file('xl/_rels/workbook.xml.rels').async('string');const p=new DOMParser();const wx=p.parseFromString(workbookXml,'application/xml');const rx=p.parseFromString(relXml,'application/xml');const rels=[...rx.getElementsByTagName('Relationship')];const sheet=wx.getElementsByTagNameNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main','sheet')[0];const rid=sheet?.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');const rel=rels.find(x=>x.getAttribute('Id')===rid);if(!rel)return[];const target=rel.getAttribute('Target').replace(/^\//,'');const sheetPath=target.startsWith('xl/')?target:'xl/'+target;const sr=new DOMParser().parseFromString(await zip.file(sheetPath).async('string'),'application/xml');const drawing=sr.getElementsByTagNameNS('http://schemas.openxmlformats.org/spreadsheetml/2006/main','drawing')[0];if(!drawing)return[];const sheetRelsPath=sheetPath.replace('worksheets/','worksheets/_rels/')+'.rels';const srx=new DOMParser().parseFromString(await zip.file(sheetRelsPath).async('string'),'application/xml');const drid=drawing.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');const drels=[...srx.getElementsByTagName('Relationship')];const drel=drels.find(x=>x.getAttribute('Id')===drid);if(!drel)return[];const dtarget=drel.getAttribute('Target');const drawingPath=(new URL(dtarget,'https://x/xl/drawings/')).pathname.replace(/^\//,'');const drawingXml=new DOMParser().parseFromString(await zip.file(drawingPath).async('string'),'application/xml');const drawingRelPath=drawingPath.replace('drawings/','drawings/_rels/')+'.rels';const drx=new DOMParser().parseFromString(await zip.file(drawingRelPath).async('string'),'application/xml');const dmap={};[...drx.getElementsByTagName('Relationship')].forEach(x=>dmap[x.getAttribute('Id')]=x.getAttribute('Target'));const anchors=[...drawingXml.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing','oneCellAnchor'),...drawingXml.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing','twoCellAnchor')];const items=[];for(const a of anchors){const fr=a.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing','from')[0];const pic=a.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing','pic')[0];if(!fr||!pic)continue;const kids=[...fr.children];const row=Number(kids.find(x=>x.localName==='row')?.textContent??0);const col=Number(kids.find(x=>x.localName==='col')?.textContent??0);const blip=pic.getElementsByTagNameNS('http://schemas.openxmlformats.org/drawingml/2006/main','blip')[0];if(!blip)continue;const rid2=blip.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed');const t=dmap[rid2]||'';const fileName=t.split('/').pop();if(!fileName||/^chart/i.test(fileName)||!(/\.(jpe?g|png|webp)$/i.test(fileName)))continue;const mediaPath='xl/media/'+fileName;const f=zip.file(mediaPath);if(!f)continue;const bytes=await f.async('base64');const ext=fileName.split('.').pop().toLowerCase();const mime=ext==='png'?'image/png':ext==='webp'?'image/webp':'image/jpeg';items.push({row,col,data:`data:${mime};base64,${bytes}`})}items.sort((a,b)=>a.row-b.row||a.col-b.col);return items.map(x=>x.data)}catch(e){console.warn('cover extraction',e);return[]}}
async function importBooks(incoming,kind){const mode=confirm(`${kind}で ${incoming.length}冊を読み込みます。\n\nOK：既存の本と統合（IDが同じ本は更新）\nキャンセル：現在の本棚を読み込みデータに置き換え`)?'merge':'replace';if(mode==='replace'){books=incoming}else{const byId=new Map(books.map(b=>[String(b.id),b]));for(const b of incoming){if(byId.has(String(b.id)))Object.assign(byId.get(String(b.id)),b);else books.push(b)}}await saveDB();renderAll();toast(`${incoming.length}冊を読み込みました`)}

async function getDB(){return getState('books')}
async function getState(key){return await new Promise((resolve,reject)=>{const req=indexedDB.open(APP_KEY,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state',{keyPath:'key'})};req.onsuccess=()=>{const db=req.result;const q=db.transaction('state','readonly').objectStore('state').get(key);q.onsuccess=()=>resolve(q.result?.value||null);q.onerror=()=>reject(q.error)};req.onerror=()=>reject(req.error)})}
async function putDB(key,value){return await new Promise((resolve,reject)=>{const req=indexedDB.open(APP_KEY,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state',{keyPath:'key'})};req.onsuccess=()=>{const db=req.result;const q=db.transaction('state','readwrite').objectStore('state').put({key,value});q.onsuccess=resolve;q.onerror=()=>reject(q.error)};req.onerror=()=>reject(req.error)})}

async function init(){try{const saved=await getDB();books=Array.isArray(saved)?saved:[];const savedMasters=await getState('masters');publishers=Array.isArray(savedMasters?.publishers)?savedMasters.publishers:[];formats=Array.isArray(savedMasters?.formats)?savedMasters.formats:[];genres=Array.isArray(savedMasters?.genres)?savedMasters.genres:[];let changed=false;for(const b of books){if(text(b.publisher)&&!publishers.some(x=>x.name===text(b.publisher))){publishers.push({id:masterId('pub',publishers),name:text(b.publisher)});changed=true}if(text(b.format)&&!formats.some(x=>x.name===text(b.format))){formats.push({id:masterId('fmt',formats),name:text(b.format)});changed=true}if(text(b.genre)&&!genres.some(x=>x.name===text(b.genre))){genres.push({id:masterId('gen',genres),name:text(b.genre)});changed=true}}for(const b of books){const p=findMaster(publishers,b.publisherId,b.publisher);const f=findMaster(formats,b.formatId,b.format);if(p&&b.publisherId!==p.id){b.publisherId=p.id;changed=true}if(f&&b.formatId!==f.id){b.formatId=f.id;changed=true}const g=findMaster(genres,b.genreId,b.genre);if(g&&b.genreId!==g.id){b.genreId=g.id;changed=true}}if(changed){await saveDB();await saveMasters()}}catch(e){console.warn(e);books=[];publishers=[];formats=[]}document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.getElementById('globalSearch').addEventListener('input',()=>renderAll());renderAll()}
